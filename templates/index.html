<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_title }}</title>
<link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="feed.xml">
{% include "_style.html" %}
</head>
<body>
<h1>{{ site_title }}</h1>
<p class="meta"><a href="feed.xml">Atom feed</a></p>
<ul>
{% for a in articles %}  <li><a href="articles/{{ a.slug }}/">{{ a.title }}</a> <span class="meta">{% if a.author %}{{ a.author }} · {% endif %}{{ a.date[:10] }}</span></li>
{% else %}  <li>No articles yet.</li>
{% endfor %}</ul>
</body>
</html>
