<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ a.title }}</title>
<link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="../../feed.xml">
{% include "_style.html" %}
</head>
<body>
<nav><a href="../../">{{ site_title }}</a></nav>
<article>
<h1>{{ a.title }}</h1>
<p class="meta">{% if a.author %}{{ a.author }} · {% endif %}<time datetime="{{ a.date }}">{{ a.date[:10] }}</time> · {{ a.parts|length }} parts</p>
<ol>
{% for p in a.parts %}  <li><a href="{{ p.path }}/">{{ p.chapter or ("Part " ~ p.n) }}</a></li>
{% endfor %}</ol>
<hr>
<p><a href="original.pdf">Original PDF</a></p>
</article>
</body>
</html>
