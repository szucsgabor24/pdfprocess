name: Build feed

on:
  push:
    paths:
      - "inbox/**.pdf"
      - "inbox/**.PDF"
      - "build.py"
      - "templates/**"
  workflow_dispatch:   # manual rerun: Actions tab -> Build feed -> Run workflow

permissions:
  contents: write      # commit results back (processed/, data/, site/)
  pages: write
  id-token: write

# One run at a time; queued runs start from the latest commit (see checkout ref).
concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # branch tip, includes commits from earlier runs
          fetch-depth: 0                # full history for PDF commit dates

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            tesseract-ocr tesseract-ocr-hun tesseract-ocr-eng ghostscript

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        id: build
        continue-on-error: true   # still publish the PDFs that succeeded
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox processed data site
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Publish PDFs [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Report failed PDFs
        if: steps.build.outcome == 'failure'
        run: echo "::warning::Some PDFs failed and were left in inbox/. See the Build step log."

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
